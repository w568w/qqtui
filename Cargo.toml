[package]
name = "qqtui"
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
description = "A native-service terminal frontend for QQ"
license = "MPL-2.0"
repository = "https://github.com/w568w/qqtui"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
futures = "0.3"
fs2 = "0.4"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
ratatui = "=0.30.2"
ratatui-image = { version = "=11.1.0", default-features = false, features = ["crossterm"] }
rusqlite = "0.40.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
toml_edit = "0.23"
unicode-segmentation = "1"
unicode-width = "0.2"
sha2 = "0.11.1"
uuid = { version = "1", features = ["v4"] }
url = "2"
linkify = "0.10"
roxmltree = "0.21"
open = {version="5.4.4",features=["shellexecute-on-windows"]}
notify-rust = { version = "4.16", default-features = false, features = ["z"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.30", features = ["signal","process"] }
freedesktop-desktop-entry = {version="0.8.3",default-features=false}
shell-words = "1.1.1"

[target."cfg(windows)".dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
winreg = "0.56.0"

[build-dependencies]
cc = "1.8.0"
shlex = "2.0.1"

[target."cfg(windows)".dependencies.windows-sys]
version = "0.61"
features = ["Win32_Foundation"]
